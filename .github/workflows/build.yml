name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'images/**']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install KIWI NG (schema validation only)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet kiwi==11.1.19

      - name: Lint
        run: PATH="$PWD/.venv/bin:$PATH" ./tools/lint.sh

  iso:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Make sure Podman is available
        run: command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: Build ISO
        run: |
          sudo mkdir -p /mnt/ella-out
          sudo ./build.sh --output /mnt/ella-out

      - name: Stage ISO and checksum
        run: |
          out=/mnt/ella-out
          iso=$(find "$out" -maxdepth 3 -name '*.iso' | head -n1)
          test -n "$iso" || { echo "::error::no ISO produced"; exit 1; }
          mkdir -p "$out/dist"
          mv "$iso" "$out/dist/Ella-x86_64.iso"
          cd "$out/dist"
          sha256sum Ella-x86_64.iso | tee SHA256SUMS
          ls -lh

      - name: Upload ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ella-iso
          path: /mnt/ella-out/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ella-iso
          path: dist

      - name: Size check
        working-directory: dist
        run: |
          for f in *.iso; do
            size=$(stat -c %s "$f")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$f is $size bytes; GitHub release assets are limited to 2 GiB"
              exit 1
            fi
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ella $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
