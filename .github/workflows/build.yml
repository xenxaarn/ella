name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'images/**']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            jq '.transports.docker["ghcr.io/xenxaarn/ella"] = [{"type":"insecureAcceptAnything"}]' policy.json > policy.json.tmp
            mv policy.json.tmp policy.json
          fi
          podman build --pull=newer \
            --label org.opencontainers.image.source=https://github.com/xenxaarn/ella \
            -t ghcr.io/xenxaarn/ella:latest \
            -t ghcr.io/xenxaarn/ella:${{ github.sha }} \
            -f Containerfile .
      - if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile digest.txt ghcr.io/xenxaarn/ella:${{ github.sha }}
          podman push ghcr.io/xenxaarn/ella:latest
      - if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - if: github.event_name != 'pull_request'
        env:
          COSIGN_PASSWORD: ""
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -n "$SIGNING_SECRET" ]; then
            cosign sign --yes --key env://SIGNING_SECRET --tlog-upload=false \
              --new-bundle-format=false --use-signing-config=false \
              --registry-referrers-mode=legacy \
              --registry-username="${{ github.actor }}" \
              --registry-password="${{ secrets.GITHUB_TOKEN }}" \
              "ghcr.io/xenxaarn/ella@$(cat digest.txt)"
            cosign verify --key cosign.pub \
              --insecure-ignore-tlog=true --new-bundle-format=false \
              --registry-username="${{ github.actor }}" \
              --registry-password="${{ secrets.GITHUB_TOKEN }}" \
              "ghcr.io/xenxaarn/ella@$(cat digest.txt)"
          fi
