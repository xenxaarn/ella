name: iso

on:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true
      - run: |
          echo "UG=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          TOKEN=$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:xenxaarn/ella:pull" | jq -r .token)
          DIGEST=$(curl -fsSL -D - -o /dev/null -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/xenxaarn/ella/manifests/latest" | awk 'tolower($1) == "docker-content-digest:" {gsub(/\r/, "", $2); print $2}')
          test -n "$DIGEST"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          sed -i "s|ghcr.io/xenxaarn/ella:latest|ghcr.io/xenxaarn/ella@${DIGEST}|" config.toml
      - id: bib
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder@sha256:a829b782ecee4764edcac472d5672a76f20002143618fcfbd17dc1cc7319e642
          config-file: ./config.toml
          image: ghcr.io/xenxaarn/ella@${{ env.DIGEST }}
          chown: ${{ env.UG }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs xfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ella-iso
          path: ${{ steps.bib.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(find "${{ steps.bib.outputs.output-directory }}" -name '*.iso' | head -n1)
          sha256sum "$ISO" > "$ISO.sha256sum"
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ISO" "$ISO.sha256sum" --clobber
          else
            gh release create "$TAG" "$ISO" "$ISO.sha256sum" --title "$TAG"
          fi
